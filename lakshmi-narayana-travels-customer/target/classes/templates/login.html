<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login | Lakshmi Narayana Travels</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/customer-style.css}">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg lnt-navbar">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-3" th:href="@{/}">
        <div class="brand-badge"><i class="fas fa-car-side fa-lg"></i></div>
        <div>
          <div class="brand-title">LAKSHMI NARAYANA</div>
          <div class="brand-subtitle">TRAVELS &bull; CAR RENTALS</div>
        </div>
      </a>
      <a th:href="@{/}" class="btn btn-outline-secondary fw-bold"><i class="fas fa-arrow-left me-1"></i> Back to Home</a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card p-4 p-md-5 border-0 shadow-lg rounded-4 bg-white">
          <div class="text-center mb-4">
            <div class="brand-badge bg-primary text-white mx-auto mb-3" style="width: 52px; height: 52px;">
              <i class="fas fa-user-lock fa-lg"></i>
            </div>
            <h4 class="fw-bold mb-1">Customer Login</h4>
            <p class="text-muted small">Sign in to manage your bookings and identity proofs</p>
          </div>

          <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small" role="alert">
            <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
          <div th:if="${infoMessage}" class="alert alert-info alert-dismissible fade show small" role="alert">
            <i class="fas fa-info-circle me-1"></i> <span th:text="${infoMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>

          <form th:action="@{/login}" method="post">
            <div class="mb-3">
              <label class="form-label small fw-bold text-muted">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fas fa-envelope text-primary"></i></span>
                <input type="email" class="form-control" name="email" value="customer@gmail.com" required placeholder="name@example.com">
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-bold text-muted">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fas fa-lock text-primary"></i></span>
                <input type="password" class="form-control" name="password" value="password123" required placeholder="••••••••">
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm mb-3">
              <i class="fas fa-sign-in-alt me-1"></i> Sign In to My Account
            </button>
          </form>

          <div class="p-3 bg-light rounded-3 small border mb-3">
            <div class="fw-bold text-dark"><i class="fas fa-key text-warning me-1"></i> Preloaded Customer Credentials:</div>
            <div class="text-muted">Email: <span class="fw-bold font-monospace text-dark">customer@gmail.com</span></div>
            <div class="text-muted">Password: <span class="fw-bold font-monospace text-dark">password123</span></div>
          </div>

          <div class="text-center small text-muted">
            Don't have an account yet? <a th:href="@{/register}" class="fw-bold text-primary">Register Here</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white py-4 mt-5 text-center small text-secondary">
    &copy; 2026 Lakshmi Narayana Travels. All Rights Reserved.
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
