<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration | Lakshmi Narayana Travels</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/customer-style.css}">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg lnt-navbar">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-3" th:href="@{/}">
        <div class="brand-badge"><i class="fas fa-car-side fa-lg"></i></div>
        <div>
          <div class="brand-title">LAKSHMI NARAYANA</div>
          <div class="brand-subtitle">TRAVELS &bull; CAR RENTALS</div>
        </div>
      </a>
      <a th:href="@{/}" class="btn btn-outline-secondary fw-bold"><i class="fas fa-arrow-left me-1"></i> Back to Home</a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4 p-md-5 border-0 shadow-lg rounded-4 bg-white">
          <div class="text-center mb-4">
            <div class="brand-badge bg-primary text-white mx-auto mb-3" style="width: 52px; height: 52px;">
              <i class="fas fa-user-plus fa-lg"></i>
            </div>
            <h4 class="fw-bold mb-1">Create Customer Account</h4>
            <p class="text-muted small">Register to book verified self-drive &amp; chauffeur cars</p>
          </div>

          <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small" role="alert">
            <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>

          <form th:action="@{/register}" method="post">
            <div class="mb-3">
              <label class="form-label small fw-bold text-muted">Full Name *</label>
              <input type="text" class="form-control" name="fullName" required placeholder="e.g. Ramesh Chandra">
            </div>

            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-bold text-muted">Email Address *</label>
                <input type="email" class="form-control" name="email" required placeholder="ramesh@example.com">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold text-muted">Mobile Number *</label>
                <input type="tel" class="form-control" name="phone" required placeholder="+91 98765 43210">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold text-muted">Password *</label>
              <input type="password" class="form-control" name="password" required placeholder="Minimum 6 characters">
            </div>

            <div class="mb-4">
              <label class="form-label small fw-bold text-muted">City / Residential Address</label>
              <textarea class="form-control" name="address" rows="2" placeholder="e.g. Jubilee Hills, Hyderabad"></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm mb-3">
              <i class="fas fa-check-circle me-1"></i> Register &amp; Continue to Profile
            </button>
          </form>

          <div class="text-center small text-muted">
            Already have an account? <a th:href="@{/login}" class="fw-bold text-primary">Sign In Here</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white py-4 mt-5 text-center small text-secondary">
    &copy; 2026 Lakshmi Narayana Travels. All Rights Reserved.
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
