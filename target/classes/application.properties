server.port=${PORT:8081}
spring.application.name=lakshmi-narayana-travels-customer

# Google Sheets Database Integration
# Set google.sheets.enabled=true and provide spreadsheetId & credentials.json to sync live with Google Sheets!
google.sheets.enabled=false
google.sheets.spreadsheetId=
google.sheets.credentialsPath=credentials.json

# Shared Local Database & Document Storage
data.shared.dir=${DATA_SHARED_DIR:../shared-data}

# Upload settings for Proofs (Aadhaar, Driving License)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Thymeleaf Template Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.com.lakshminarayana=INFO

